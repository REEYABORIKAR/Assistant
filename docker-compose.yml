services:
  db:
    image: postgres:16-alpine
    container_name: refyne-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refyne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refyne_password}
      POSTGRES_DB: ${POSTGRES_DB:-refyne}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refyne -d refyne"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: refyne-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://refyne:refyne_password@db:5432/refyne}
      AUTH_SIGNING_SECRET: ${AUTH_SIGNING_SECRET:-refyne_super_secret_jwt_key_2026!}
      SECRET_KEY: ${SECRET_KEY:-refyne_super_secret_jwt_key_2026!}
      GROQ_API_KEY: ${GROQ_API_KEY}
      PYTHONPATH: /app/src
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn refyne.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: refyne-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  postgres_data:

